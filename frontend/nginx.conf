server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API vers le backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # IP réelle du client pour le rate-limit du backend (trust proxy = 1)
        proxy_set_header X-Forwarded-For $remote_addr;
        # Arrêt propre d'un gros modpack : jusqu'à 120 s côté Docker
        proxy_read_timeout 180s;
        # Import de monde : jusqu'à 2 Go (limite multer côté backend) — défaut nginx = 1 Mo
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_send_timeout 1800s;
        # Téléchargement de monde streamé : pas de mise en tampon disque côté nginx
        proxy_buffering off;
    }

    # Proxy WebSocket
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
